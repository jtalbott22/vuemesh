<style>
  /* The studio's look (vm.css, its documents block), as on Privacy and Terms: the newest versions as
     cards, a version as a pill (the newest red, like on air), the older ones folded into rows */
  #log p, #log li { color: var(--text-2); line-height: 1.6; }
  #log li { margin: .35em 0; }
  #log ul ul { margin: .2em 0 .4em; }
  #log code { font-size: .88em; background: var(--surface-2); border-radius: 5px; padding: .05em .35em; overflow-wrap: anywhere; }
  .rel { scroll-margin-top: 20px; }
  section.rel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--card-r); padding: clamp(18px, 2.4vw, 26px); margin: 0 0 16px; box-shadow: var(--shadow); }
  section.rel > :last-child { margin-bottom: 0; }
  .rel h2 { font-size: 1.25rem; margin: 0 0 .7em; line-height: 1.35; display: flex; align-items: baseline; gap: .6em; flex-wrap: wrap; }
  .ver { display: inline-flex; align-items: center; padding: .15em .65em; border-radius: 999px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line);
    font: 800 .82rem/1.4 var(--font); font-stretch: 100%; font-variant-numeric: tabular-nums; letter-spacing: .02em; color: var(--text); flex: none; }
  #log > section.rel:first-child .ver { background: var(--tally); color: #fff; box-shadow: none; }
  .vt { font-weight: 700; font-stretch: 125%; }
  details.rel { border-top: 1px solid var(--line); }
  details.rel:last-child { border-bottom: 1px solid var(--line); }
  details.rel summary { cursor: pointer; list-style: none; padding: 12px 4px; border-radius: 8px; }
  details.rel summary:hover { background: var(--surface); }
  details.rel summary::-webkit-details-marker { display: none; }
  details.rel summary h2 { font-size: 1rem; margin: 0; flex-wrap: nowrap; }
  details.rel summary h2::before { content: '▸'; flex: none; width: 1em; color: var(--muted); transition: transform .15s; }
  details.rel[open] summary h2::before { transform: rotate(90deg); }
  details.rel summary .vt { font-stretch: 100%; font-weight: 600; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  details.rel[open] { padding-bottom: 12px; }
  details.rel > :not(summary) { padding: 0 4px 0 calc(1em + .6em + 4px); }
  .older { display: flex; align-items: center; gap: .55em; margin: 34px 0 8px; font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--text-2); }
  .older::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  @media (prefers-reduced-motion: reduce) { details.rel summary h2::before { transition: none; } }
</style>
</head>
<body class="vm-page">
<header class="vm-top">
  <a class="vm-mark" href="/"><i aria-hidden="true"></i>VUEMesh</a><a data-vm-version hidden></a>
  <span class="vm-spacer"></span>
  <button type="button" id="themeBtn"></button>
</header>
  <main class="vm-doc">
    <p class="vm-eyebrow">What's new</p>
    <h1>What's new</h1>
    <p class="lead">Every change to VUEMesh, newest first. Most come from real shows: a show log sent in, a camera that misbehaved, a laptop that couldn't keep up. You're running version <b id="ver"></b>.</p>
    <div id="log" aria-live="polite"><p>Loading…</p></div>
    <footer class="vm-foot"><a href="/">Home</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="/accessibility">Accessibility</a><a href="https://github.com/jtalbott22/vuemesh">Source code</a></footer>
  </main>
<script type="module">
  import { $, themeButton } from '/js/vm.js';
  import { APP_VERSION } from '/js/brand.js';
  import { renderChangelog } from '/js/changelog.js';
  themeButton($('#themeBtn'));
  $('#ver').textContent = APP_VERSION;
  const versions = await renderChangelog($('#log'), 3);
  // (a line between the newest and the folded older ones)
  const firstFolded = document.querySelector('#log details.rel');
  if (firstFolded && versions.length > 3) firstFolded.insertAdjacentHTML('beforebegin', `<p class="older">Earlier · ${versions.length - 3} more versions</p>`);
</script>
<script type="module" src="/js/version.js"></script>
</body>
</html>
