<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calibrate a TV — VUEMesh</title>
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script src="/js/theme-boot.js"></script>
<link rel="stylesheet" href="/css/vm.css">
<style>
  /* A phone measuring a TV's display lag: it reads the studio screen's beacon and the TV's in
     turn, and sends the difference to the studio's Calibrate dialog. */
  body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; background: #000; color: #fff; }
  header, footer { padding: 14px 16px; }
  header h1 { font-size: 1.3rem; margin: 0 0 4px; }
  header p { margin: 0; color: #c3c6cf; font-size: .95rem; }
  .cam { position: relative; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .aim { position: absolute; inset: 18% 14%; border: 3px solid #ffffff99; border-radius: 12px; pointer-events: none; }
  .aim.hit { border-color: #2fd56b; }
  .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .meter { background: #18191d; border-radius: 10px; padding: 10px 12px; }
  .meter b { display: block; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: #a9acb4; }
  .meter span { font: 700 1.3rem ui-monospace, Menlo, monospace; }
  .meter.done { box-shadow: inset 0 0 0 2px #2fd56b; }
  .result { font-size: 1.1rem; margin: 12px 0 0; min-height: 1.4em; }
</style>
</head>
<body>
<header>
  <h1>Calibrate a TV</h1>
  <p id="say">Point this phone at the studio screen's code for a few seconds, then at the TV's.</p>
</header>
<div class="cam"><video id="v" playsinline muted autoplay></video><div class="aim" id="aim" aria-hidden="true"></div></div>
<footer>
  <div class="meters">
    <div class="meter" id="mRef"><b>Studio screen</b><span id="nRef">0</span> readings</div>
    <div class="meter" id="mTv"><b>TV</b><span id="nTv">0</span> readings</div>
  </div>
  <p class="result" id="result" aria-live="polite"></p>
</footer>
<script src="/vendor/jsQR.js"></script>
<script src="/config.js"></script>
<script type="module">
  import { $, now, decodeQR, parseTimecode, meshSocket } from '/js/vm.js';

  const q = new URLSearchParams(location.search);
  const eventId = (q.get('e') || '').toUpperCase(), calId = q.get('c') || '';
  const NEED = 15; // readings of each: the code changes 15 times a second, so the best of 15 is within a few ms
  // Each reading: the clock in the code minus this phone's clock when the frame was taken. Both
  // codes carry the studio's clock; the TV's shows later by its lag (beyond the studio screen's),
  // so the best (largest) TV reading is that much below the best studio-screen one. The camera's
  // own delay is the same for both, and drops out.
  const ref = [], tv = [];
  let host = null, sent = false, lastProgress = 0;
  const sock = meshSocket({
    eventId, role: 'viewer', name: 'Calibrating a TV',
    onPeers: (peers) => (host = peers.find((p) => p.role === 'host')?.peer || null),
  });
  const tell = (data) => host && sock.signal(host, { tvcal: { c: calId, ...data } });

  if (!/^[A-Z0-9]{6}$/.test(eventId) || !calId) $('#say').textContent = 'Open this by scanning the code in the studio’s Calibrate window.';
  const video = $('#v');
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    await video.play().catch(() => {});
  } catch (e) {
    $('#say').textContent = `The camera isn't available (${e.message}).`;
  }

  const canvas = document.createElement('canvas');
  async function scan() {
    if (sent) return;
    if (video.readyState >= 2) {
      const w = 'BarcodeDetector' in window ? 720 : 560, h = Math.round((video.videoHeight / video.videoWidth) * w) || 315;
      canvas.width = w;
      canvas.height = h;
      const local = now();
      canvas.getContext('2d', { willReadFrequently: true }).drawImage(video, 0, 0, w, h);
      const text = await decodeQR(canvas);
      const tc = parseTimecode(text);
      if (tc && tc.e === eventId) {
        const isRef = text.includes('/tvcal') && text.includes(`c=${calId}`);
        (isRef ? ref : tv).push(tc.t - local);
        $('#aim').classList.add('hit');
        setTimeout(() => $('#aim').classList.remove('hit'), 150);
        show();
      }
    }
    setTimeout(scan, 100);
  }
  function show() {
    $('#nRef').textContent = Math.min(ref.length, NEED);
    $('#nTv').textContent = Math.min(tv.length, NEED);
    $('#mRef').classList.toggle('done', ref.length >= NEED);
    $('#mTv').classList.toggle('done', tv.length >= NEED);
    const say = ref.length < NEED ? 'Now hold it on the studio screen’s code.' : tv.length < NEED ? 'Got the studio screen. Now hold it on the TV’s code.' : '';
    if (say) $('#say').textContent = say;
    if (performance.now() - lastProgress > 700) {
      lastProgress = performance.now();
      tell({ progress: `Phone: ${Math.min(ref.length, NEED)} readings of this screen, ${Math.min(tv.length, NEED)} of the TV` });
    }
    if (ref.length >= NEED && tv.length >= NEED && host) {
      const ms = Math.max(...ref) - Math.max(...tv);
      sent = true;
      tell({ ms });
      $('#say').textContent = 'Done. The studio has it.';
      $('#result').textContent = ms >= 0 ? `The TV shows ${Math.round(ms)} ms later than the studio screen (beyond what it was set to).` : `The TV is ${Math.round(-ms)} ms ahead of what it was set to.`;
      video.srcObject?.getTracks().forEach((t) => t.stop());
      setTimeout(() => sock.close(), 1500);
    }
  }
  scan();
</script>
</body>
</html>
