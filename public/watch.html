<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="An event filmed by everyone who was there, cut into one film.">
<meta name="robots" content="noindex, follow">
<meta property="og:site_name" content="VUEMesh">
<meta property="og:type" content="website">
<meta property="og:url" content="https://vuemesh.com/watch">
<meta property="og:title" content="Watch on VUEMesh">
<meta property="og:description" content="An event filmed by everyone who was there, cut into one film.">
<meta property="og:image" content="https://vuemesh.com/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="VUEMesh: A production studio. In the browser. A multiviewer with one camera on air, a tablet in preview, and more cameras waiting.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Watch on VUEMesh">
<meta name="twitter:description" content="An event filmed by everyone who was there, cut into one film.">
<meta name="twitter:image" content="https://vuemesh.com/og.png">
<meta name="twitter:image:alt" content="VUEMesh: A production studio. In the browser. A multiviewer with one camera on air, a tablet in preview, and more cameras waiting.">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0f1013">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script src="/js/theme-boot.js"></script>
<link href="/css/archivo.css" rel="stylesheet">
<link rel="stylesheet" href="/css/vm.css">
<style>
  .wrap { max-width: 1040px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px)); }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  header h1 { font-size: clamp(1.5rem, 4.5vw, 2.4rem); margin: 0; }
  .screen { position: relative; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; }
  .screen video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .screen.portrait { aspect-ratio: 9 / 16; max-height: 80vh; margin: 0 auto; }
  .sponsor { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; background: var(--surface); border-radius: 12px; padding: 12px 14px; margin-top: 14px; text-decoration: none; }
  .sponsor[hidden] { display: none; }
  .sponsor img { width: 120px; max-height: 80px; object-fit: contain; border-radius: 6px; background: #fff; }
  .sponsor small { display: block; color: var(--muted); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; }
  .sponsor b { font-size: 1.05rem; }
  .foot { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: .9rem; }
  .waiting { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--text-2); background: var(--surface-2); font-size: 1.1rem; }
  .screen .big { position: absolute; inset: 0; margin: auto; width: 84px; height: 84px; border-radius: 50%; background: #000a; box-shadow: inset 0 0 0 3px #fff; font-size: 0; z-index: 2; }
  .screen .big::after { content: ""; position: absolute; left: 34px; top: 26px; border-left: 24px solid #fff; border-top: 16px solid transparent; border-bottom: 16px solid transparent; }
  .screen .tap { position: absolute; inset: 0; z-index: 1; background: transparent; border-radius: 0; min-height: 0; }
  .screen .onair { position: absolute; left: 10px; top: 10px; z-index: 2; background: var(--tally); font-weight: 700; font-size: .78rem; padding: .2em .6em; border-radius: 4px; }
  .controls { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
  .controls input[type=range] { flex: 1; min-height: 32px; padding: 0; accent-color: var(--tally); background: transparent; border: 0; }
  .controls .tc { min-width: 10ch; text-align: right; color: var(--soft); }
  .angles { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
  .angles button { flex: none; background: var(--stage-2); min-height: 40px; padding: .45em .85em; font-weight: 600; font-size: .9rem; }
  .angles button[aria-pressed="true"] { background: var(--tally); }
  .angles button.idle { opacity: .45; }
  .credits { margin-top: 26px; }
  .credits ol { padding-left: 1.2em; margin: 0; }
  .credits li { margin: .35em 0; }
  .credits li span { color: var(--soft); }
  .note { color: var(--soft); font-size: .9rem; }
  select { width: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Loading…</h1>
    <div class="row"><button type="button" id="themeBtn"></button><button type="button" id="share" class="ghost">Share</button></div>
  </header>

  <div class="screen" id="screen">
    <video id="film" controls playsinline preload="metadata"></video>
    <div class="waiting" id="waiting" hidden></div>
  </div>
  <p class="note" id="note"></p>
  <a class="sponsor" id="sponsor" hidden target="_blank" rel="noopener sponsored"><img id="sponsorImg" alt=""><span><small>Presented by</small><b id="sponsorName"></b></span></a>

  <section class="credits" id="credits" hidden>
    <h2>Shot by</h2>
    <ol id="creditList"></ol>
  </section>
  <p class="note" id="verify"></p>
  <p class="note"><a href="#" id="camLink">At the event right now? Add your angle.</a></p>
  <div class="foot"><span><a href="/">Made with VUEMesh</a> <a data-vm-version hidden></a></span><span class="patreon">Built by one person. <a id="patreonLink" target="_blank" rel="noopener">Support it on Patreon</a></span></div>
</div>

<script src="/config.js"></script>
<script type="module" src="/js/watch.js"></script>
<script type="module" src="/js/version.js"></script>
</body>
</html>
